[build]
builder = "DOCKERFILE"

# ── Backend service (FastAPI + RQ worker via start.sh) ────────────────────────
# In Railway dashboard: set root directory to "backend"
# Environment variables to set in Railway dashboard:
#   DATABASE_URL   → from Railway PostgreSQL plugin (auto-injected)
#   REDIS_URL      → from Railway Redis plugin (auto-injected)
#   OPENROUTER_API_KEY
#   OPENROUTER_MODEL = openai/gpt-3.5-turbo
#   LLM_PROVIDER   = openrouter
#   TOOL_ENCRYPTION_KEY  (generate: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
#   ALLOWED_ORIGINS = ["*"]
#   LOG_LEVEL      = INFO

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "./start.sh"
